# POS Offline — locations del vhost principal (vps1-binario.duckdns.org)
# Separse TODO lo de este proyecto en un archivo propio: nginx no permite
# partir locations de un mismo server en bloques de otros archivos server,
# pero el contenido sí puede vivir aqui (include desde 10-vhost-principal.conf).
# Routing por path (misma decision Etapa 2): /api/, /api-pos-offline/,
# /panel-pos-offline — un solo certificado ACME, sin subdominios nuevos.
#
# Resolver de Docker + upstream en variable en cada location:
#  - nginx arranca aunque POS esté caído. Con un proxy_pass fijo, "host not found"
#    impediría levantar nginx y se caerían también turnos y el placeholder;
#  - cuando el CI de POS recrea un contenedor y cambia su IP, nginx la re-resuelve sola.
# (El resolver va dentro del location para no pisar el 1.1.1.1 que usa el issuer ACME.)

# /api/ directo: PUBLIC_BASE_URL no lleva path (updater del POS desktop arma
# URLs absolutas como {PUBLIC_BASE_URL}/api/updates/latest.json).
location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $pos_backend_upstream http://panel-backend:4000;
    proxy_pass $pos_backend_upstream;   # sin URI: mantiene /api/... intacto
    client_max_body_size 128m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api-pos-offline/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    # El "set" tiene que ir antes del rewrite ... break: con break termina la fase
    # de rewrite del location y un "set" posterior ya no se ejecutaría.
    set $pos_backend_upstream http://panel-backend:4000;
    # Equivale al URI que antes ponía proxy_pass (/api/), pero explícito: con un
    # upstream en variable nginx no hace el reemplazo de prefijo por sí solo.
    rewrite ^/api-pos-offline/(.*)$ /api/$1 break;
    proxy_pass $pos_backend_upstream;
    client_max_body_size 128m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /panel-pos-offline {
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $pos_web_upstream http://panel-web:3000;
    proxy_pass $pos_web_upstream;       # Next basePath: /panel-pos-offline
    client_max_body_size 128m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
