# POS Offline — locations del vhost principal (vps1-binario.duckdns.org)
# Separse TODO lo de este proyecto en un archivo propio: nginx no permite
# partir locations de un mismo server en bloques de otros archivos server,
# pero el contenido sí puede vivir aqui (include desde 10-placeholder.conf).
# Routing por path (misma decision Etapa 2): /api/, /api-pos-offline/,
# /panel-pos-offline — un solo certificado ACME, sin subdominios nuevos.

# /api/ directo: PUBLIC_BASE_URL no lleva path (updater del POS desktop arma
# URLs absolutas como {PUBLIC_BASE_URL}/api/updates/latest.json).
location /api/ {
    proxy_pass http://panel-backend:4000;   # sin URI: mantiene /api/... intacto
    client_max_body_size 128m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api-pos-offline/ {
    proxy_pass http://panel-backend:4000/api/;
    client_max_body_size 128m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /panel-pos-offline {
    proxy_pass http://panel-web:3000;       # Next basePath: /panel-pos-offline
    client_max_body_size 128m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
