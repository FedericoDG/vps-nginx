# Rangos oficiales de Cloudflare — https://www.cloudflare.com/ips/
# Fuente: https://www.cloudflare.com/ips-v4 y https://www.cloudflare.com/ips-v6
# (consultado el 2026-10-20). Cloudflare avisa los cambios por mail; conviene
# revisar esta lista cada tanto.
#
# Uso: incluir dentro del server block de un vhost que pueda quedar detrás de la
# nube naranja de Cloudflare. Si el tráfico NO viene de Cloudflare, la IP de
# origen no cae en estos rangos y el header se ignora: el vhost se comporta
# exactamente igual que sin este archivo.
#
# Por qué importa: el backend corre con `trust proxy = 1` y sus limitadores
# keyean por `req.ip`. Detrás de Cloudflare, `$remote_addr` es la IP del edge y
# todos los usuarios quedarían contados como uno solo, con los límites
# aplicándose a todos juntos.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
