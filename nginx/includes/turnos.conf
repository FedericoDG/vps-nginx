# Turnos (repo joaquingomez3/barberia) — redirect al dominio propio
#
# La app se mudó a reservaplus.com.ar y ahora sirve desde su raíz: se compila con
# BASE_PATH=/ en barberia/docker-compose.prod.yml. Antes vivía acá, colgada del
# path /turnos/ de este vhost compartido.
#
# Estas dos locations quedan solo para no matar los links viejos ya compartidos.
# El redirect CONSERVA el path, así /turnos/turno/123 cae en /turno/123 y no en
# la home.
#
# El vhost dedicado vive en conf.d/20-reservaplus.conf.
# Este archivo se incluye con una línea desde 10-vhost-principal.conf.

location = /turnos {
    return 301 https://reservaplus.com.ar/;
}

location /turnos/ {
    rewrite ^/turnos(/.*)$ https://reservaplus.com.ar$1 permanent;
}
