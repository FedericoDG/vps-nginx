# Turnos (repo joaquingomez3/barberia) — locations del vhost principal (vps1-binario.duckdns.org)
# Mismo esquema que pos-offline.conf: todo lo de este proyecto vive en este archivo y se incluye
# con una línea desde 10-vhost-principal.conf.
#
# La app corre en su propio compose (barberia/docker-compose.prod.yml), sin publicar puertos (C1),
# y se une a vps-net con el alias "turnos-web". Adentro sirve todo desde la raíz: acá se le saca
# el prefijo /turnos. La app ya se compila sabiendo que vive en /turnos/ (rutas, API y fotos).

location = /turnos {
    return 301 /turnos/;
}

location /turnos/ {
    # Resolver de Docker + upstream en variable:
    #  - nginx arranca aunque turnos esté caído (con un proxy_pass fijo, "host not found" impediría
    #    levantar nginx y se caerían también POS y el placeholder);
    #  - cuando el CI de turnos recrea el contenedor y cambia su IP, nginx la vuelve a resolver sola.
    # (El resolver va dentro del location para no pisar el 1.1.1.1 que usa el issuer ACME.)
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $turnos_upstream http://turnos-web:80;   # el "set" tiene que ir antes del rewrite ... break
    rewrite ^/turnos(/.*)$ $1 break;
    proxy_pass $turnos_upstream;

    client_max_body_size 4m;   # fotos de perfil/portada
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se REEMPLAZA (no se agrega) el X-Forwarded-For del cliente: la app limita reservas e intentos
    # de login por IP y no debe poder recibir una IP inventada.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La app manda HSTS; bajo un path afectaría a todo el dominio (POS incluido). Esa decisión es de vps-nginx.
    proxy_hide_header Strict-Transport-Security;
    # La app ya manda sus encabezados de seguridad (CSP, X-Frame-Options DENY, nosniff, Referrer-Policy).
    # Con un add_header propio en este location no se heredan los de tls-params.conf, que quedarían duplicados
    # y contradictorios (ej. X-Frame-Options SAMEORIGIN + DENY).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
}