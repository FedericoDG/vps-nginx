load_module modules/ngx_http_acme_module.so;

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Resolver for ACME issuer (Let's Encrypt directory)
    resolver 1.1.1.1 valid=30s;
    resolver_timeout 5s;

    # Shared zone required by acme module
    acme_shared_zone zone=acme:1m;

    # ACME issuer — staging for T8, switch to production in T9
    # Contact is a placeholder; replace with real email when a domain is set.
    acme_issuer letsencrypt {
        uri https://acme-staging-v02.api.letsencrypt.org/directory;
        contact admin@example.com;
        state_path /var/cache/nginx/acme;
        accept_terms_of_service;
    }

    include /etc/nginx/snippets/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
