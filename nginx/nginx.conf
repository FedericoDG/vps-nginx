load_module modules/ngx_http_acme_module.so;

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # HTTP/2 en todos los listeners SSL. Sin esto nginx negocia HTTP/1.1 y, con
    # una RTT alta, cada asset cuesta una ida y vuelta extra (el POS Online baja
    # 5 archivos y se nota). HTTP/2 los multiplexa sobre una sola conexión.
    # Directiva disponible desde nginx 1.25.1; la imagen usa la 1.29.
    http2 on;

    # Resolver for ACME issuer (Let's Encrypt directory)
    # ipv6=off: bridge network is IPv4-only; LE staging has AAAA and would fail.
    resolver 1.1.1.1 ipv6=off valid=30s;
    resolver_timeout 5s;

    # Shared zone required by acme module
    acme_shared_zone zone=acme:1m;

    # ACME issuer — producción (T9). Staging usada y validada en T8 (ver plan.md P3).
    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        contact binariodevlabs@gmail.com;
        state_path /var/cache/nginx/acme;
        accept_terms_of_service;
    }

    include /etc/nginx/snippets/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
