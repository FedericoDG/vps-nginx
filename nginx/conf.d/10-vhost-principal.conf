# Vhost 443 principal (compartido) — vps1-binario.duckdns.org
# Es el vhost por defecto del VPS: redirige la raiz al sitio de la empresa y monta los
# locations de cada proyecto con UNA línea de include, desde el archivo propio de cada uno.
# Hoy: POS Offline (pos-offline.conf) y Turnos (turnos.conf).
# Los proyectos con dominio propio NO se montan acá: tienen su vhost dedicado en
# conf.d/ (ej. 20-reservaplus.conf, exclusivo de la app de turnos).
# Historia: Etapa 1 — T7 placeholder con cert self-signed, T8/T9 ACME nativo.

server {
    listen 443 ssl default_server;
    server_name vps1-binario.duckdns.org;

    # T8 — certificado vía ACME nativo (issuer "letsencrypt", staging en nginx.conf)
    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    include /etc/nginx/snippets/tls-params.conf;

    # La raiz redirige al sitio de la empresa. Como este vhost es el default_server,
    # tambien es el destino de cualquier hostname que llegue al VPS sin vhost propio:
    # mejor ahi que una pagina de relleno.
    # Los locations de cada proyecto (mas largos) siguen ganando sobre este: /api/,
    # /api-pos-offline/, /panel-pos-offline y los redirects de turnos no se tocan.
    location / {
        return 301 https://binariodevlabs.com/;
    }

    # POS Offline: TODO en su propio archivo (nginx/includes/pos-offline.conf,
    # montado a /etc/nginx/includes/). Una línea al agregar/refactorizar POS:
    include /etc/nginx/includes/pos-offline.conf;
    include /etc/nginx/includes/turnos.conf;
    # Health / verification helper
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
