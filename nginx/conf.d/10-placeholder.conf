# Placeholder vhost — Etapa 1 (T7)
# Sirve nginx/static/placeholder.html en 443 con cert provisional.
# T8/T9 reemplazarán ssl_certificate por variables $acme_certificate (ACME nativo).

server {
    listen 443 ssl default_server;
    server_name _;

    # Cert provisional local (self-signed) — permite verificar T7 sin dominio real.
    # Camino dentro del contenedor: /etc/nginx/certs/ (montado desde ./nginx/certs)
    ssl_certificate /etc/nginx/certs/placeholder.crt;
    ssl_certificate_key /etc/nginx/certs/placeholder.key;

    # Cuando se active ACME en VPS (T8), este bloque pasará a:
    #   acme_certificate letsencrypt;
    #   ssl_certificate $acme_certificate;
    #   ssl_certificate_key $acme_certificate_key;
    #   ssl_certificate_cache max=2;
    # y el hostname real en server_name.

    include /etc/nginx/snippets/tls-params.conf;

    root /usr/share/nginx/placeholder;
    index placeholder.html;

    location / {
        try_files $uri /placeholder.html =404;
    }

    # Health / verification helper
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
