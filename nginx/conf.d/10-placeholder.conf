# Vhost 443 principal — Etapa 1
# T7: placeholder con cert self-signed. T8: cert vía ACME staging (módulo nativo).
# T9: cambiará el issuer a producción (nginx.conf).

server {
    listen 443 ssl default_server;
    server_name vps1-binario.duckdns.org;

    # T8 — certificado vía ACME nativo (issuer "letsencrypt", staging en nginx.conf)
    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    include /etc/nginx/snippets/tls-params.conf;

    root /usr/share/nginx/placeholder;
    index placeholder.html;

    location / {
        try_files $uri /placeholder.html =404;
    }

    # POS Offline: TODO en su propio archivo (nginx/includes/pos-offline.conf,
    # montado a /etc/nginx/includes/). Una línea al agregar/refactorizar POS:
    include /etc/nginx/includes/pos-offline.conf;

    # Health / verification helper
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
