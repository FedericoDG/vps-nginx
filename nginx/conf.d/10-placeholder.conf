# Vhost 443 principal — Etapa 1
# T7: placeholder con cert self-signed. T8: cert vía ACME staging (módulo nativo).
# T9: cambiará el issuer a producción (nginx.conf).

server {
    listen 443 ssl default_server;
    server_name vps1-binario.duckdns.org;

    # T8 — certificado vía ACME nativo (issuer "letsencrypt", staging en nginx.conf)
    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    include /etc/nginx/snippets/tls-params.conf;

    root /usr/share/nginx/placeholder;
    index placeholder.html;

    location / {
        try_files $uri /placeholder.html =404;
    }

    # POS Offline: API (backend Express) y panel (Next.js) bajo rutas del mismo
    # host — un solo certificado ACME, sin subdominios nuevos (DuckDNS).
    # /api/ directo: PUBLIC_BASE_URL no lleva path (updater del POS desktop).
    location /api/ {
        proxy_pass http://panel-backend:4000;   # sin URI: mantiene /api/... intacto
        client_max_body_size 128m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-pos-offline/ {
        proxy_pass http://panel-backend:4000/api/;
        client_max_body_size 128m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /panel-pos-offline {
        proxy_pass http://panel-web:3000;
        client_max_body_size 128m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health / verification helper
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
