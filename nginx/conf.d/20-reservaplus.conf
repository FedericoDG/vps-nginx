# Vhost 443 dedicado — reservaplus.com.ar (app de turnos / barberia)
#
# Diferencia con turnos.conf: ahí la app cuelga de un path (/turnos/) dentro del
# vhost compartido con POS y el placeholder. Acá el dominio es EXCLUSIVO de la app,
# así que todo lo que llegue a este host va a turnos-web y la app sirve desde su raíz.
#
# Por eso NO hay rewrite: la app se compila con BASE_PATH vacío
# (ver barberia/docker-compose.prod.yml → BASE_PATH) y ya sirve todo desde /.
#
# El listener 80 y el challenge ACME los cubre 00-acme-and-redirect.conf
# (listen 80 default_server, server_name _), que atiende cualquier hostname.

server {
    listen 443 ssl;
    # El cert ACME se emite para cada nombre del server_name (HTTP-01, por el listener 80).
    # Requiere que el DNS de reservaplus.com.ar ya resuelva a este VPS.
    server_name reservaplus.com.ar www.reservaplus.com.ar;

    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    include /etc/nginx/snippets/tls-params.conf;

    # Nombre oficial: el apex. El www redirige al apex con 301 (decisión).
    if ($host = www.reservaplus.com.ar) {
        return 301 https://reservaplus.com.ar$request_uri;
    }

    location / {
        # Mismo esquema que turnos.conf: resolver de Docker + upstream en variable.
        #  - nginx arranca aunque la app esté caída (con un proxy_pass fijo, "host not found"
        #    impediría levantar nginx y se caerían también POS y el placeholder);
        #  - cuando el CI de barberia recrea el contenedor y cambia su IP, nginx la re-resuelve sola.
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $turnos_upstream http://turnos-web:80;
        proxy_pass $turnos_upstream;

        client_max_body_size 4m;   # fotos de perfil/portada
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se REEMPLAZA (no se agrega) el X-Forwarded-For del cliente: la app limita reservas
        # e intentos de login por IP y no debe poder recibir una IP inventada.
        # El nginx del contenedor (barberia/frontend/nginx.conf) resuelve la IP real desde acá
        # y se la pasa al backend con TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La app manda HSTS. Se oculta por ahora: el HSTS se cachea en el navegador y es
        # difícil de revertir, así que activarlo es una decisión aparte (a diferencia del
        # vhost compartido, acá afectaría a este dominio y a nadie más).
        proxy_hide_header Strict-Transport-Security;
        # La app ya manda sus encabezados de seguridad (CSP, X-Frame-Options DENY, nosniff,
        # Referrer-Policy) desde barberia/frontend/security-headers.conf. Con un add_header
        # propio en este location no se heredan los de tls-params.conf, que quedarían
        # duplicados y contradictorios (ej. X-Frame-Options SAMEORIGIN + DENY).
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
