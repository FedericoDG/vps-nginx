# Vhost 443 dedicado — app.aipos.com.ar (POS Online / sistemapos-web)
#
# La web (React/Vite) vive en la raíz y su API en /api/. Las dos cosas corren en
# contenedores propios del stack "sistemapos-web" (repo joaquingomez3/sistemapos-web),
# unidos a vps-net con los alias onlinepos-web y onlinepos-backend.
#
# No hay rewrite de prefijo: el backend ya expone todas sus rutas bajo /api/
# (ver backend/src/index.ts) y la web se compila con base "/".
#
# REQUISITO: el DNS de app.aipos.com.ar tiene que resolver a este VPS ANTES de
# desplegar este archivo, o el módulo ACME no puede emitir el certificado.
# (Mismo aviso que en 20-reservaplus.conf y 30-aipos.conf.)

server {
    listen 443 ssl;
    server_name app.aipos.com.ar;

    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    include /etc/nginx/snippets/tls-params.conf;

    # Si app.aipos.com.ar queda detrás de la nube naranja de Cloudflare, la
    # conexión llega desde un edge suyo y esto recupera la IP real del cliente.
    # Sin Cloudflare se ignora (la IP de origen no cae en sus rangos), así que
    # dejarlo puesto no cambia nada hasta que se active el proxy. Es importante
    # porque el backend limita por req.ip (ver 40-app-aipos.conf, location /api/).
    include /etc/nginx/includes/cloudflare-real-ip.conf;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $onlinepos_backend http://onlinepos-backend:4100;
        proxy_pass $onlinepos_backend;      # sin URI: mantiene /api/... intacto

        client_max_body_size 128m;          # fotos de OCR, importaciones y respaldos
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # keepalive hacia el upstream

        # /api/pos/stream/... es Server-Sent Events: si nginx bufferea la
        # respuesta, el navegador no recibe nada hasta que el stream termina.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se REEMPLAZA (no se agrega) el X-Forwarded-For del cliente: el backend
        # corre con trust proxy = 1 y sus rate limiters keyean por req.ip, así que
        # con $proxy_add_x_forwarded_for cualquiera podría inventarse la IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Web (SPA) ────────────────────────────────────────────────────────────
    # El nginx del contenedor ya resuelve el fallback de React Router a index.html.
    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $onlinepos_web http://onlinepos-web:80;
        proxy_pass $onlinepos_web;

        client_max_body_size 128m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
