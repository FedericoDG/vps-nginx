# Vhost 443 dedicado — aipos.com.ar (POS offline)
#
# Dominio propio del producto. Sirve tres cosas del mismo proyecto:
#   /api/    → backend (el updater del POS arma {PUBLIC_BASE_URL}/api/...)
#   /panel   → panel de administración (compilado con basePath /panel)
#   /        → landing pública (contenedor landing)
#
# Mismo esquema de upstream que los otros vhosts (resolver de Docker + upstream
# en variable): nginx arranca aunque los contenedores estén caídos, y re-resuelve
# la IP sola cuando el CI los recrea.
#
# REQUISITO: el DNS de aipos.com.ar debe resolver a este VPS ANTES de desplegar
# este archivo. El módulo ACME emite el certificado por HTTP-01 al arrancar
# (ver el mismo aviso en 20-reservaplus.conf).

server {
    listen 443 ssl;
    server_name aipos.com.ar www.aipos.com.ar;

    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    include /etc/nginx/snippets/tls-params.conf;

    # Nombre oficial: el apex. El www redirige al apex con 301 (misma decisión
    # que reservaplus.com.ar).
    if ($host = www.aipos.com.ar) {
        return 301 https://aipos.com.ar$request_uri;
    }

    # ── Backend ──────────────────────────────────────────────────────────────
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $aipos_backend http://panel-backend:4000;
        proxy_pass $aipos_backend;          # sin URI: mantiene /api/... intacto
        client_max_body_size 128m;          # subida de instaladores del POS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Panel de administración ──────────────────────────────────────────────
    location /panel {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $aipos_panel http://panel-web:3000;
        proxy_pass $aipos_panel;            # Next basePath: /panel
        client_max_body_size 128m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Landing: todo lo demás ───────────────────────────────────────────────
    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $aipos_landing http://landing:80;
        proxy_pass $aipos_landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
