# Listener 80 — ACME HTTP-01 challenge + redirect to HTTPS (RF3, RF7)
# The acme module intercepts /.well-known/acme-challenge/ automatically.
# All other traffic is redirected to HTTPS.

server {
    listen 80 default_server;
    server_name _;

    # ACME challenge — let the module handle it; do not redirect.
    location /.well-known/acme-challenge/ {
        # No return; the acme module serves the challenge response.
        # Fallback 404 if no challenge is active — keeps the location explicit.
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
